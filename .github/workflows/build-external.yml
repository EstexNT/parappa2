name: build-external
on:
  pull_request_target:
    types: [ opened, synchronize ]
jobs:
  authorize:
    if: github.repository != github.event.pull_request.head.repo.full_name
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'build-external' || 'build-internal' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo ✓
  build:
    needs: authorize
    uses: ./.github/workflows/build.yml
    secrets:
      P3_BINARY_TOKEN: ${{ secrets.P3_BINARY_TOKEN }}
      P3_BINARY_REPO: ${{ secrets.P3_BINARY_REPO }}
      JUL12_ENCRYPTION_KEY: ${{ secrets.JUL12_ENCRYPTION_KEY }}
